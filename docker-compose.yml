services:

  db:
    image: postgres:17-alpine
    container_name: estulanches_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: estulanches
      POSTGRES_USER: ${DB_USER:-estulanches}
      POSTGRES_PASSWORD: ${DB_PASS:-Troque-Esta-Senha-123}
      TZ: America/Sao_Paulo
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./sql.sql:/docker-entrypoint-initdb.d/01-sql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rede_interna

  app:
    build: .
    image: estulanches:1.0.0
    container_name: estulanches_app
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: estulanches
      DB_USER: ${DB_USER:-estulanches}
      DB_PASS: ${DB_PASS:-Troque-Esta-Senha-123}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna

volumes:
  dados_postgres:

networks:
  rede_interna:
