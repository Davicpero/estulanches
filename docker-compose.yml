services:

  db:
    image: mysql:8.4
    container_name: estulanches_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: estulanches
      MYSQL_USER: ${DB_USER:-estulanches}
      MYSQL_PASSWORD: ${DB_PASS:-Troque-Esta-Senha-123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-Troque-Root-456}
      TZ: America/Sao_Paulo
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASS:-Troque-Root-456}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rede_interna

  app:
    build: .
    image: estulanches:1.0.0
    container_name: estulanches_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: estulanches
      DB_USER: ${DB_USER:-estulanches}
      DB_PASS: ${DB_PASS:-Troque-Esta-Senha-123}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna

volumes:
  dados_mysql:

networks:
  rede_interna:
