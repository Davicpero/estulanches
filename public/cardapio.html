<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Cardápio - EstuLanches</title>
</head>
<body>
  <nav>
    <b>🥪 EstuLanches</b> |
    <a href="/painel.html">Início</a> |
    <a href="/cardapio.html">Cardápio</a> |
    <a href="/pedidos.html">Pedidos</a> |
    Usuário: <b id="usuario"></b>
    <button id="sair">Sair</button>
  </nav>
  <hr>

  <h1>Cardápio</h1>
  <p id="mensagem"></p>

  <h2>Novo produto</h2>
  <form id="form-produto">
    <input name="nome" placeholder="Nome" required>
    <select name="categoria">
      <option>Salgado</option>
      <option>Lanche</option>
      <option>Bebida</option>
      <option>Doce</option>
    </select>
    <input name="preco" type="number" step="0.01" min="0.01" placeholder="Preço" required>
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Produtos</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Situação</th><th>Ações</th></tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script type="module" src="/js/cardapio.js"></script>
</body>
</html>
